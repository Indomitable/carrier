[package]
name = "carrier"
version = "0.1.0"
edition = "2021"
description = "Universal package outdated checker"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# HTTP (synchronous)
ureq = { version = "3", features = ["json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.36", features = ["serialize"] }

# Versioning
semver = "1"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Output
colored = "2"
indicatif = "0.17"
